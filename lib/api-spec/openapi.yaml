        category:
          type: string
        isCompleted:
          type: boolean
        completedBy:
          type: string
        completedAt:
          type: string
          format: date-time
        notes:
          type: string
      required:
        - id
        - label
        - category
        - isCompleted

    CreateMonthEndChecklistBody:
      type: object
      properties:
        month:
          type: string
          description: YYYY-MM format
        fiscalYear:
          type: string
        owner:
          type: string
