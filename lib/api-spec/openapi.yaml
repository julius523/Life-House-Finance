openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Life House Reentry Finance Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard and summary operations
  - name: expenses
    description: Expense claims and reimbursements
  - name: vendors
    description: Vendor management
  - name: bills
    description: Vendor bills and payables
  - name: receipts
    description: Receipt tracking and document management
  - name: transactions
    description: Bank transactions and reconciliation
  - name: programs
    description: Programs, grants, funds, and sites
  - name: approvals
    description: Approval workflows
  - name: monthEnd
    description: Month-end close checklists
  - name: notifications
    description: In-app notifications for the current user
  - name: accounting
    description: Chart of Accounts, accounting settings, and ledger status
  - name: auth
    description: Session authentication for the current user
  - name: admin
    description: Admin-only endpoints (user management, email settings, etc.)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all user accounts (admin only)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
    post:
      operationId: createAdminUser
      tags: [admin]
      summary: Create a new user account (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminUserBody"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"

  /admin/users/{id}/password:
    post:
      operationId: changeAdminUserPassword
      tags: [admin]
      summary: Change a user account password (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeAdminUserPasswordBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get overall financial dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent financial activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/spending-by-program:
    get:
      operationId: getSpendingByProgram
      tags: [dashboard]
      summary: Spending breakdown by program/grant/fund/site
      responses:
        "200":
          description: Spending by program
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpendingByDimension"

  /dashboard/pending-approvals-count:
    get:
      operationId: getPendingApprovalsCount
      tags: [dashboard]
      summary: Count of items pending approval
      responses:
        "200":
          description: Pending approvals count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingApprovalsCount"

  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List expense claims
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, submitted, approved, rejected, reimbursed, needs_correction]
        - name: programId
          in: query
          schema:
            type: integer
        - name: submittedBy
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of expense claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseListResponse"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Create a new expense claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseBody"
      responses:
        "201":
          description: Created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/{id}:
    get:
      operationId: getExpense
      tags: [expenses]
      summary: Get expense by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Expense detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    put:
      operationId: updateExpense
      tags: [expenses]
      summary: Update an expense claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExpenseBody"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense claim (draft only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /expenses/{id}/approve:
    post:
      operationId: approveExpense
      tags: [expenses]
      summary: Approve an expense claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalActionBody"
      responses:
        "200":
          description: Updated expense (with accounting-bridge outcome)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Expense"
                  - type: object
                    properties:
                      accounting:
                        $ref: "#/components/schemas/AccountingDraftResult"

  /expenses/{id}/regenerate-accounting-draft:
    post:
      operationId: regenerateAccountingDraftForExpense
      tags: [expenses]
      summary: Manually regenerate the accounting draft for an approved expense (Task #52)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Existing or newly created draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountingDraftResult"
        "409":
          description: Expense is not in approved status
        "422":
          description: Generation blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountingDraftResult"

  /expenses/{id}/dismiss-duplicate:
    post:
      operationId: dismissExpenseDuplicate
      tags: [expenses]
      summary: Mark an expense as not a duplicate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/{id}/reject:
    post:
      operationId: rejectExpense
      tags: [expenses]
      summary: Reject an expense claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectionBody"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List vendors
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"
    post:
      operationId: createVendor
      tags: [vendors]
      summary: Create a new vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorBody"
      responses:
        "201":
          description: Created vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get vendor by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vendor detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
    put:
      operationId: updateVendor
      tags: [vendors]
      summary: Update a vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorBody"
      responses:
        "200":
          description: Updated vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
    delete:
      operationId: deleteVendor
      tags: [vendors]
      summary: Delete a vendor (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /bills:
    get:
      operationId: listBills
      tags: [bills]
      summary: List vendor bills
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, submitted, approved, paid, overdue, rejected, needs_correction]
        - name: vendorId
          in: query
          schema:
            type: integer
        - name: programId
          in: query
          schema:
            type: integer
        - name: submittedBy
          in: query
          schema:
            type: string
        - name: submittedByEmail
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of bills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bill"
    post:
      operationId: createBill
      tags: [bills]
      summary: Create a vendor bill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillBody"
      responses:
        "201":
          description: Created bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}:
    get:
      operationId: getBill
      tags: [bills]
      summary: Get bill by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bill detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
    put:
      operationId: updateBill
      tags: [bills]
      summary: Update a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillBody"
      responses:
        "200":
          description: Updated bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
    delete:
      operationId: deleteBill
      tags: [bills]
      summary: Delete a bill (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /bills/{id}/reject:
    post:
      operationId: rejectBill
      tags: [bills]
      summary: Reject a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                action:
                  type: string
                  enum: [send_back, close]
                  default: close
              required:
                - reason
      responses:
        "200":
          description: Updated bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/resubmit:
    post:
      operationId: resubmitBill
      tags: [bills]
      summary: Resubmit a bill that was sent back for correction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/approve:
    post:
      operationId: approveBill
      tags: [bills]
      summary: Approve a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalActionBody"
      responses:
        "200":
          description: Updated bill (with accounting bridge result)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Bill"
                  - type: object
                    properties:
                      accounting:
                        $ref: "#/components/schemas/AccountingDraftResult"

  /bills/{id}/regenerate-accounting-draft:
    post:
      operationId: regenerateBillAccountingDraft
      tags: [bills]
      summary: Task #63 — manually retry accrual or payment draft generation for a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventType:
                  type: string
                  enum: [accrual, payment]
              required: [eventType]
      responses:
        "200":
          description: Generator result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountingDraftResult"

  /bills/{id}/mark-accounting-not-applicable:
    post:
      operationId: markBillAccountingNotApplicable
      tags: [bills]
      summary: Task #63 — flip a bill's accrual or payment leg to not_applicable with a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventType:
                  type: string
                  enum: [accrual, payment]
                note:
                  type: string
                  minLength: 3
                  maxLength: 500
              required: [eventType, note]
      responses:
        "200":
          description: Updated bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /accounting/blocked-bills:
    get:
      operationId: listBlockedBills
      tags: [accounting]
      summary: Task #63 — review queue of bills whose accrual or payment draft generation failed
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 25
        - name: eventType
          in: query
          description: Filter to one leg ('accrual' or 'payment'). Omit for both.
          schema:
            type: string
            enum: [accrual, payment]
        - name: reasonCode
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated blocked-bill rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedBillsListResponse"
        "403":
          description: Admin/approver only

  /accounting/blocked-bills/count:
    get:
      operationId: getBlockedBillsCount
      tags: [accounting]
      summary: Lightweight count of blocked bill legs (used for nav badge)
      responses:
        "200":
          description: Total count
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                required: [total]
        "403":
          description: Admin/approver only

  /accounting/blocked-bills/retry:
    post:
      operationId: retryBlockedBills
      tags: [accounting]
      summary: Bulk re-run accrual/payment draft generation for the given blocked bill legs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      billId:
                        type: integer
                      eventType:
                        type: string
                        enum: [accrual, payment]
                    required: [billId, eventType]
                  minItems: 1
                  maxItems: 200
              required: [items]
      responses:
        "200":
          description: Per-leg retry result
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        billId:
                          type: integer
                        eventType:
                          type: string
                        result:
                          $ref: "#/components/schemas/AccountingDraftResult"
                      required: [billId, eventType, result]
                required: [results]
        "403":
          description: Admin/approver only

  /receipts:
    get:
      operationId: listReceipts
      tags: [receipts]
      summary: List receipts and documents
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: vendorId
          in: query
          schema:
            type: integer
        - name: linked
          in: query
          description: Filter by whether the receipt is linked to an expense/bill
          schema:
            type: boolean
        - name: linkedExpenseId
          in: query
          description: Only return receipts attached to this expense
          schema:
            type: integer
        - name: linkedBillId
          in: query
          description: Only return receipts attached to this bill
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: List of receipts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptListResponse"
    post:
      operationId: createReceipt
      tags: [receipts]
      summary: Upload and create a receipt record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReceiptBody"
      responses:
        "201":
          description: Created receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"

  /receipts/{id}:
    get:
      operationId: getReceipt
      tags: [receipts]
      summary: Get receipt by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Receipt detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
    delete:
      operationId: deleteReceipt
      tags: [receipts]
      summary: Delete a receipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /receipts/missing-report:
    get:
      operationId: getMissingReceiptsReport
      tags: [receipts]
      summary: Get expenses missing receipts
      responses:
        "200":
          description: Missing receipts report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MissingReceiptItem"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List bank transactions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [unmatched, matched, reconciled]
        - name: accountId
          in: query
          schema:
            type: integer
        - name: matchedExpenseId
          in: query
          schema:
            type: integer
        - name: matchedBillId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Manually create or import a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionBody"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/{id}/convert-to-expense:
    post:
      operationId: convertTransactionToExpense
      tags: [transactions]
      summary: Create a draft expense from an unmatched debit and link them.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                programId:
                  type: integer
                paymentMethod:
                  type: string
                  enum: [cash, check, credit_card, debit_card, bank_transfer, other]
                submittedBy:
                  type: string
      responses:
        "200":
          description: Created expense + updated transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  expense:
                    $ref: "#/components/schemas/Expense"
                  transaction:
                    $ref: "#/components/schemas/Transaction"
                required: [expense, transaction]

  /transactions/{id}/convert-to-bill:
    post:
      operationId: convertTransactionToBill
      tags: [transactions]
      summary: Create a draft bill from an unmatched debit and link them.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vendorId:
                  type: integer
                programId:
                  type: integer
                dueDate:
                  type: string
                  format: date
              required: [vendorId]
      responses:
        "200":
          description: Created bill + updated transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  bill:
                    $ref: "#/components/schemas/Bill"
                  transaction:
