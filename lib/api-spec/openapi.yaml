        matched:
          type: integer
        unmatched:
          type: integer
        totalDebits:
          type: number
        totalCredits:
          type: number
        netCashFlow:
          type: number
      required:
        - month
        - totalTransactions
        - reconciled
        - matched
        - unmatched
        - totalDebits
        - totalCredits
        - netCashFlow

    Program:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [program, grant, fund, site, department]
        description:
          type: string
        code:
          type: string
        budgetAmount:
          type: number
        fiscalYear:
          type: string
        isActive:
          type: boolean
        totalSpend:
          type: number
        percentUsed:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - type
        - isActive
        - createdAt

    CreateProgramBody:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [program, grant, fund, site, department]
        description:
          type: string
        code:
          type: string
        budgetAmount:
          type: number
        fiscalYear:
          type: string
      required:
        - name
        - type

    ProgramSpendingReport:
      type: object
      properties:
        programId:
          type: integer
        programName:
          type: string
        fiscalYear:
          type: string
        budgetAmount:
          type: number
        totalSpend:
          type: number
        percentUsed:
          type: number
        expenseCount:
          type: integer
        billCount:
          type: integer
        spendByMonth:
          type: array
          items:
            type: object
            properties:
              month:
                type: string
              amount:
                type: number
