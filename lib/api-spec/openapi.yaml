    JournalEntryExportSendLogEntry:
      type: object
      properties:
        id:
          type: integer
        scheduleId:
          type: integer
        sentAt:
          type: string
        recipients:
          type: array
          items:
            type: string
        rowCount:
          type: integer
        rangeFrom:
          type: string
          nullable: true
        rangeTo:
          type: string
          nullable: true
        status:
          type: string
        errorMessage:
          type: string
          nullable: true
        filename:
          type: string
        triggeredBy:
          type: string
        triggeredByUserId:
          type: integer
          nullable: true
        filterPostedByUserLabel:
          type: string
          nullable: true
          description: >
            Snapshot of the resolved "Display Name <email>" for the schedule's
            posted-by filter at the time this run fired (Task #89). Null when
            no filter was set on that run. Stored on the row so historical
            entries stay auditable even after the schedule's filter changes.
        filterApproverUserLabel:
          type: string
          nullable: true
          description: >
            Snapshot of the resolved "Display Name <email>" for the schedule's
            approver filter at the time this run fired. See
            filterPostedByUserLabel.
        filterStatus:
          type: string
          nullable: true
          description: >
            Task #97 — snapshot of the schedule's status filter (posted /
            reversed) as it was when this run fired. Null when no filter was
            set, or for rows written before #97.
        filterSource:
          type: string
          nullable: true
          description: >
            Task #97 — snapshot of the schedule's source filter (copilot /
            manual / expense / bill) as it was when this run fired. Null when
            no filter was set, or for rows written before #97.
        cadence:
          type: string
          nullable: true
          description: >
            Task #97 — snapshot of the schedule's cadence (daily / weekly /
            monthly) at run time. Null only for rows written before #97.
        includeLines:
          type: boolean
          nullable: true
          description: >
            Task #97 — snapshot of the schedule's include-lines flag at run
            time. Null only for rows written before #97.
      required:
        - id
        - scheduleId
        - sentAt
        - recipients
        - rowCount
        - status
        - filename
        - triggeredBy

