              schema:
                $ref: "#/components/schemas/JournalEntryExportScheduleResponse"

  /journal-entry-export-schedules/{id}:
    patch:
      operationId: updateJournalEntryExportSchedule
      tags: [accounting]
      summary: Update an existing CSV export schedule (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryExportSchedulePatchBody"
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryExportScheduleResponse"
    delete:
      operationId: deleteJournalEntryExportSchedule
      tags: [accounting]
      summary: Delete a CSV export schedule (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /journal-entry-export-schedules/{id}/run-now:
    post:
      operationId: runJournalEntryExportScheduleNow
      tags: [accounting]
      summary: Manually trigger a CSV export schedule (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryExportRunNowResponse"

  /journal-entry-export-schedules/{id}/log:
    get:
      operationId: getJournalEntryExportScheduleLog
      tags: [accounting]
      summary: Recent send-log entries for a schedule (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
