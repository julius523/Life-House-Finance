              schema:
                $ref: "#/components/schemas/JournalEntryExportSendLogListResponse"

  /admin/daily-snapshot:
    get:
      operationId: getDailySnapshotInfo
      tags: [admin]
      summary: Info about today's restore-point snapshot (admin only)
      responses:
        "200":
          description: Snapshot info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySnapshotInfo"

  /admin/restore-day:
    post:
      operationId: restoreToday
      tags: [admin]
      summary: Restore database to today's start-of-day snapshot (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MasterPasswordBody"
      responses:
        "200":
          description: Restore result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreDayResponse"

  /admin/wipe-data:
    post:
      operationId: wipeAllData
      tags: [admin]
      summary: Permanently delete all transactional data (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MasterPasswordBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /admin/email-settings:
    get:
      operationId: getEmailSettings
      tags: [admin]
      summary: Get the configurable email templates and sender name (admin only)
      responses:
        "200":
          description: Email settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettingsResponse"
    put:
      operationId: updateEmailSettings
      tags: [admin]
      summary: Replace the email templates and sender name (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSettingsUpdateBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /admin/email-settings/test:
    post:
      operationId: sendEmailSettingsTest
      tags: [admin]
      summary: Send a test email of one template to the current admin user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSettingsTestBody"
      responses:
        "200":
          description: Test email send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettingsTestResponse"

  /admin/notifications:
    get:
      operationId: listAdminNotifications
      tags: [admin]
      summary: List the most recent 200 notifications and their email delivery status (admin only)
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotificationListResponse"

  /admin/notifications/{id}/resend:
    post:
      operationId: resendAdminNotification
      tags: [admin]
      summary: Re-send the email for a specific notification (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendAdminNotificationResponse"
        "502":
          description: Email could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendAdminNotificationResponse"

  /transactions/auto-match:
    post:
      operationId: autoMatchTransactions
      tags: [transactions]
      summary: Auto-match unmatched debit transactions to existing expenses
      responses:
        "200":
          description: Auto-match result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoMatchResponse"

  /accounting/threads/{id}/messages:
    post:
      operationId: sendCopilotMessage
      tags: [accounting]
      summary: Send a user message into a copilot thread and get the assistant reply
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendCopilotMessageBody"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCopilotMessageResponse"
        "503":
          description: OpenAI key missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCopilotMessageResponse"

  /accounting/remediation:
    get:
      operationId: listRemediationQueue
      tags: [accounting]
      summary: List accounting remediation queue rows
      parameters:
        - in: query
          name: code
          schema:
            type: string
            enum:
              - missing_account
              - archived_account
              - non_postable_account
              - invalid_line_amount
              - unbalanced_entry
        - in: query
          name: entryId
          schema: { type: integer }
        - in: query
          name: sourceType
          schema:
            type: string
            enum: [expense, bill]
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, posted]
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Remediation queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationListResponse"

  /accounting/remediation/counts:
    get:
      operationId: getRemediationCounts
      tags: [accounting]
      summary: Aggregate counts for the remediation queue
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationCounts"

  /accounting/journal-entry-drafts/{draftId}/lines/{lineId}/remediate-account:
    post:
      operationId: remediateDraftLineAccount
      tags: [accounting]
      summary: Repoint a single draft journal-entry line to a valid account
      parameters:
        - in: path
          name: draftId
          required: true
          schema: { type: integer }
        - in: path
          name: lineId
          required: true
          description: 0-based index inside the draft's payload.lines array
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: integer
                  description: Active, postable chart-of-accounts id
                note:
                  type: string
                  description: Operator-supplied reason recorded on the activity log
              required: [accountId, note]
      responses:
        "200":
          description: Draft line updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediateDraftLineResponse"
        "400":
          description: Invalid input
        "404":
          description: Draft, line, or account not found

  /accounting/journal-entries/{entryId}/remediate:
    post:
      operationId: remediatePostedJournalEntry
      tags: [accounting]
      summary: Apply a corrective action to a posted journal entry
      description: |
        Posted JEs are immutable in place. This endpoint runs one of two
        explicit corrective actions:
          - reverse_and_replace: reverse the original (audited via
            reverseJournalEntry) and post a fresh replacement JE.
          - adjusting_entry: post a new balanced JE that references the
            original in its memo, leaving the original untouched.
      parameters:
        - in: path
          name: entryId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemediatePostedEntryRequest"
      responses:
        "201":
          description: Corrective action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediatePostedEntryResponse"
        "400":
          description: Invalid input or replacement post failed
        "403":
          description: Forbidden (role gate)
        "404":
          description: Entry not found
        "409":
          description: Period locked or replacement post failed

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    BalanceSheetAccount:
      type: object
      description: |
        A single Chart-of-Accounts row contributing to a Balance Sheet bucket
        on the financial-summary report.
      properties:
        accountId:
          type: integer
        code:
          type: string
        name:
          type: string
        balance:
          type: number
          description: |
            Net balance expressed in the bucket's natural sign (positive when
            it adds to the parent total, negative when it offsets it).
      required:
        - accountId
        - code
        - name
        - balance

    DashboardSummary:
      type: object
      properties:
        totalExpensesPending:
          type: number
        totalExpensesThisMonth:
          type: number
        totalBillsOverdue:
          type: number
        totalBillsDueThisMonth:
          type: number
        unmatchedTransactions:
          type: integer
        pendingApprovalsCount:
          type: integer
        totalVendors:
          type: integer
        totalPrograms:
          type: integer
        cashBalance:
          type: number
        monthlyBurnRate:
          type: number
      required:
        - totalExpensesPending
        - totalExpensesThisMonth
        - totalBillsOverdue
        - totalBillsDueThisMonth
        - unmatchedTransactions
        - pendingApprovalsCount
        - totalVendors
        - totalPrograms
        - cashBalance
        - monthlyBurnRate

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          description: "Activity event type. Free-form to accommodate workflow events added by new modules without forcing client/spec churn."
        description:
          type: string
        actor:
          type: string
        amount:
          type: number
        createdAt:
          type: string
          format: date-time
        referenceId:
          type: integer
        referenceType:
          type: string
      required:
        - id
        - type
        - description
        - actor
        - createdAt

    SpendingByDimension:
      type: object
      properties:
        programId:
          type: integer
        programName:
          type: string
        programType:
          type: string
        totalAmount:
          type: number
        budgetAmount:
          type: number
        percentUsed:
          type: number
      required:
        - programId
        - programName
        - programType
        - totalAmount

    PendingApprovalsCount:
      type: object
      properties:
        expenses:
          type: integer
        bills:
          type: integer
        total:
          type: integer
      required:
        - expenses
        - bills
        - total

    BlockedExpenseRow:
      type: object
      description: |
        Task #54 — single row in the blocked-expense review queue. Joins
        in human-readable program / category / payment-method labels so
        the page can render without per-row lookups.
      properties:
        id:
          type: integer
        expenseDate:
          type: string
          format: date
        merchant:
          type: string
        amount:
          type: number
        submittedBy:
          type: string
        submittedByEmail:
          type: string
          nullable: true
        programId:
          type: integer
          nullable: true
        programName:
          type: string
          nullable: true
        categoryId:
          type: integer
          nullable: true
        categoryName:
          type: string
          nullable: true
        paymentMethod:
          type: string
          enum: [cash, check, credit_card, debit_card, bank_transfer, other]
        accountingBlockReason:
          type: string
          nullable: true
          enum:
            [
              missing_category,
              missing_mapping,
              archived_account,
              non_postable_account,
              invalid_payment_method_rule,
              other,
            ]
        accountingGeneratedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - expenseDate
        - merchant
        - amount
        - submittedBy
        - paymentMethod

    BlockedExpensesListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BlockedExpenseRow"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        metrics:
          type: object
          description: Counts keyed by accountingBlockReason. Missing keys mean zero.
          additionalProperties:
            type: integer
      required: [items, total, page, pageSize, metrics]

    AccountingDraftResult:
      type: object
      description: |
        Task #52 / #63 — outcome of an attempt to bridge a source document
        (expense or bill) into a manual journal entry draft. `ok=true` means
        a draft is now linked; `created` distinguishes a brand new draft from
        re-returning an existing one (idempotent retry). `ok=false`
        carries a stable machine-readable `reason` code.
      properties:
        ok:
          type: boolean
        created:
          type: boolean
        manualJournalEntryDraftId:
          type: integer
        reason:
          type: string
          enum:
            [
              missing_category,
              missing_mapping,
              archived_account,
              non_postable_account,
              invalid_payment_method_rule,
              missing_ap_account,
              missing_cash_account,
              other,
            ]
        message:
          type: string
      required:
        - ok

    BlockedBillRow:
      type: object
      description: Task #63 — one row per blocked bill leg in the accounting bridge.
      properties:
        billId:
          type: integer
        eventType:
          type: string
          enum: [accrual, payment]
        invoiceDate:
          type: string
          format: date
          nullable: true
        dueDate:
          type: string
          format: date
        amount:
          type: number
        vendorId:
          type: integer
        vendorName:
          type: string
        programId:
          type: integer
          nullable: true
        programName:
          type: string
          nullable: true
        categoryId:
          type: integer
          nullable: true
        categoryName:
          type: string
          nullable: true
        accountingBlockReason:
          type: string
          nullable: true
        accountingGeneratedAt:
          type: string
          format: date-time
          nullable: true
      required: [billId, eventType, dueDate, amount, vendorId, vendorName]

    BlockedBillsListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BlockedBillRow"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        metrics:
          type: object
          description: Counts keyed by accountingBlockReason. Missing keys mean zero.
          additionalProperties:
            type: integer
      required: [items, total, page, pageSize, metrics]

    Expense:
      type: object
      properties:
        id:
          type: integer
        submittedBy:
          type: string
        submittedByEmail:
          type: string
        expenseDate:
          type: string
          format: date
        merchant:
          type: string
        description:
          type: string
        amount:
          type: number
        paymentMethod:
          type: string
          enum: [cash, check, credit_card, debit_card, bank_transfer, other]
        programId:
          type: integer
        programName:
          type: string
        categoryId:
          type: integer
          nullable: true
        categoryName:
          type: string
          nullable: true
          description: Resolved category display name. Null when categoryId is null (legacy uncategorized expense).
        status:
          type: string
          enum: [draft, submitted, approved, rejected, reimbursed, needs_correction]
        managerApprovedBy:
          type: string
        financeApprovedBy:
          type: string
        rejectionReason:
          type: string
        reimbursedDate:
          type: string
          format: date
        receiptIds:
          type: array
          items:
            type: integer
        accountingEntryRef:
          type: string
        accountingStatus:
          type: string
          enum: [pending, draft_created, posted, blocked, not_applicable]
          description: Task #52 — accounting bridge state, separate from operational `status`.
        accountingBlockReason:
          type: string
          nullable: true
          enum:
            [
              missing_category,
              missing_mapping,
              archived_account,
              non_postable_account,
              invalid_payment_method_rule,
              other,
            ]
        accountingGeneratedAt:
          type: string
          format: date-time
          nullable: true
        accountingLink:
          type: object
          description: |
            Task #53 — populated by the detail endpoint when an
            accounting_source_links row exists for this expense. Lets
            the UI link out to the generated draft and (once posted)
            the journal entry without a second round-trip.
          properties:
            draftId:
              type: integer
              nullable: true
            draftStatus:
              type: string
              nullable: true
              enum: [draft, submitted, approved, rejected, posted]
            draftEntryDate:
              type: string
              format: date
              nullable: true
            draftMemo:
              type: string
              nullable: true
            journalEntryId:
              type: integer
              nullable: true
            journalEntryNo:
              type: string
              nullable: true
            journalEntryDate:
              type: string
              format: date
              nullable: true
            journalEntryStatus:
              type: string
              nullable: true
              enum: [posted, reversed]
        duplicateDismissed:
          type: boolean
          description: True when the user has confirmed this is not a duplicate.
        potentialDuplicateIds:
          type: array
          items:
            type: integer
          description: Other expense ids with matching date + amount.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - submittedBy
        - expenseDate
        - merchant
        - description
        - amount
        - paymentMethod
        - status
        - createdAt

    ExpenseListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required:
        - items
        - total
        - page
        - pageSize

    CreateExpenseBody:
      type: object
      properties:
        submittedBy:
          type: string
        submittedByEmail:
          type: string
        expenseDate:
          type: string
          format: date
        merchant:
          type: string
        description:
          type: string
        amount:
          type: number
        paymentMethod:
          type: string
          enum: [cash, check, credit_card, debit_card, bank_transfer, other]
        programId:
          type: integer
        categoryId:
          type: integer
          description: Required. Use the seeded "Uncategorized" id when the submitter has no better classification.
        receiptIds:
          type: array
          items:
            type: integer
      required:
        - submittedBy
        - expenseDate
        - merchant
        - description
        - amount
        - paymentMethod
        - categoryId

    UpdateExpenseBody:
      type: object
      properties:
        merchant:
          type: string
        description:
          type: string
        amount:
          type: number
        expenseDate:
          type: string
          format: date
        paymentMethod:
          type: string
          enum: [cash, check, credit_card, debit_card, bank_transfer, other]
        programId:
          type: integer
        categoryId:
          type: integer
          nullable: true
        receiptIds:
          type: array
          items:
            type: integer
        status:
          type: string
          enum: [draft, submitted, approved, rejected, reimbursed, needs_correction]

    ApprovalActionBody:
      type: object
      properties:
        approvedBy:
          type: string
        notes:
          type: string
      required:
        - approvedBy

    RejectionBody:
      type: object
      properties:
        rejectedBy:
          type: string
        reason:
          type: string
        action:
          type: string
          description: "send_back returns the expense to the submitter for correction; close marks it permanently rejected."
          enum: [send_back, close]
          default: close
      required:
        - rejectedBy
        - reason

    Vendor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        category:
          type: string
        taxId:
          type: string
        paymentTerms:
          type: string
        isActive:
          type: boolean
        totalSpend:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - isActive
        - createdAt

    CreateVendorBody:
      type: object
      properties:
        name:
          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        category:
          type: string
        taxId:
          type: string
        paymentTerms:
          type: string
      required:
        - name

    Bill:
      type: object
      properties:
        id:
          type: integer
        vendorId:
          type: integer
        vendorName:
          type: string
        invoiceNumber:
          type: string
        invoiceDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        amount:
          type: number
        description:
          type: string
        programId:
          type: integer
        programName:
          type: string
        categoryId:
          type: integer
          nullable: true
          description: Task #63 — expense category that drives the Dr expense leg of the accrual draft.
        categoryName:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, submitted, approved, paid, overdue, rejected, needs_correction]
        approvedBy:
          type: string
        rejectionReason:
          type: string
        paidDate:
          type: string
          format: date
        receiptIds:
          type: array
          items:
            type: integer
        submittedBy:
          type: string
        submittedByEmail:
          type: string
        accountingStatus:
          type: string
          enum: [pending, draft_created, blocked, not_applicable]
          description: Task #63 — accrual leg bridge status (draft generated on bill approval).
        accountingBlockReason:
          type: string
          nullable: true
        accountingGeneratedAt:
          type: string
          format: date-time
          nullable: true
        accountingPaymentStatus:
          type: string
          enum: [pending, draft_created, blocked, not_applicable]
          description: Task #63 — payment leg bridge status (draft generated on bill payment).
        accountingPaymentBlockReason:
          type: string
          nullable: true
        accountingPaymentGeneratedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - vendorId
        - vendorName
        - dueDate
        - amount
        - status
        - createdAt

    CreateBillBody:
      type: object
      properties:
        vendorId:
          type: integer
        invoiceNumber:
          type: string
        invoiceDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        amount:
          type: number
        description:
          type: string
        programId:
          type: integer
        categoryId:
          type: integer
          nullable: true
          description: Task #63 — expense category for the accrual draft Dr leg.
        receiptIds:
          type: array
          items:
            type: integer
        submittedBy:
          type: string
      required:
        - vendorId
        - dueDate
