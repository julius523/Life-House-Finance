    ReconciliationIndependentNetIncomeCheck:
      type: object
      description: >
        Structurally-independent cross-check between P&L net income (computed
        directly from revenue/expense lines) and equity-account movement
        (computed directly from equity-account lines), without going through
        the shared computeLedgerSummary helper. Returns warning when the
        current chart of accounts cannot support a true independent
        derivation (e.g. no Retained Earnings / period-close mechanism).
      properties:
        checkCode:
          type: string
          enum: [net_income_matches_equity_movement]
        status:
          type: string
          enum: [pass, fail, warning]
        shortMessage:
          type: string
        pnlNetIncomeCents:
          type: integer
        equityMovementNetIncomeCents:
          type: integer
        deltaCents:
          type: integer
        includedEquityAccounts:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationIncludedEquityAccount"
        excludedEquityAccounts:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationExcludedEquityAccount"
        limitationNote:
          type: string
          nullable: true
      required:
        [
          checkCode,
          status,
          shortMessage,
          pnlNetIncomeCents,
          equityMovementNetIncomeCents,
          deltaCents,
          includedEquityAccounts,
          excludedEquityAccounts,
          limitationNote,
        ]

    ReconciliationPerEntryFailure:
      type: object
      description: >
        A single integrity failure for one posted/reversed journal entry in
        the reconciliation window. A JE may produce more than one failure
        row (e.g. unbalanced AND missing-account).
      properties:
        journalEntryId:
          type: integer
        entryNumber:
          type: string
        entryDate:
          type: string
          format: date
        checkCode:
          type: string
          enum:
            [
              je_unbalanced,
              je_missing_account,
              je_zero_lines,
              je_invalid_line_amount,
              je_archived_account,
              je_non_postable_account,
            ]
        status:
          type: string
          enum: [fail]
        deltaCents:
          type: integer
          nullable: true
          description: Signed cent delta for je_unbalanced; null for other codes.
        shortMessage:
          type: string
      required:
        [
          journalEntryId,
          entryNumber,
          entryDate,
          checkCode,
          status,
          deltaCents,
          shortMessage,
        ]

    ReconciliationPerEntrySummary:
      type: object
      description: >
        Per-journal-entry integrity tie-out section. Walks every
        posted/reversed JE in the reconciliation window and surfaces
        localized corruption that aggregate checks would miss.
      properties:
        totalEntriesChecked:
          type: integer
        failingEntryCount:
          type: integer
        failingEntries:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationPerEntryFailure"
      required: [totalEntriesChecked, failingEntryCount, failingEntries]

