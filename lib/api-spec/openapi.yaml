          type: number
        missingReceipts:
          type: array
          items:
            $ref: "#/components/schemas/MissingReceiptItem"
        bankReconciliation:
          type: object
          properties:
            totalTransactions:
              type: integer
            unmatched:
              type: integer
            matched:
              type: integer
            reconciled:
              type: integer
            totalDebits:
              type: number
            totalCredits:
              type: number
            netCashFlow:
              type: number
          required:
            - totalTransactions
            - unmatched
            - matched
            - reconciled
            - totalDebits
            - totalCredits
            - netCashFlow
        profitAndLoss:
          type: object
          properties:
            incomeByProgram:
              type: array
              items:
                type: object
                properties:
                  programId: { type: integer }
                  programName: { type: string }
                  amount: { type: number }
                required: [programName, amount]
            uncategorizedIncome:
              type: number
            totalIncome:
              type: number
            expensesByProgram:
              type: array
              items:
                type: object
                properties:
                  programId: { type: integer }
                  programName: { type: string }
                  amount: { type: number }
                required: [programName, amount]
            uncategorizedExpenses:
              type: number
            totalExpenses:
              type: number
            netIncome:
              type: number
            # Task #61 — per-account breakdown for ledger-source P&L. Only
            # populated when source=ledger; in operational source the
            # arrays are empty because operational P&L has no posted
            # journal-entry backing.
            incomeByAccount:
              type: array
              items:
                type: object
                properties:
                  accountId: { type: integer }
                  code: { type: string }
                  name: { type: string }
                  amount: { type: number }
                required: [accountId, code, name, amount]
            expensesByAccount:
              type: array
              items:
                type: object
                properties:
                  accountId: { type: integer }
                  code: { type: string }
                  name: { type: string }
                  amount: { type: number }
                required: [accountId, code, name, amount]
          required:
            - incomeByProgram
            - uncategorizedIncome
            - totalIncome
            - expensesByProgram
            - uncategorizedExpenses
            - totalExpenses
            - netIncome
            - incomeByAccount
            - expensesByAccount
        balanceSheet:
          type: object
          properties:
            cashOnHand:
              type: number
              description: Net of reconciled credits minus reconciled debits.
            outstandingReceivables:
              type: number
              description: Matched-but-not-yet-reconciled credits.
            unpaidBills:
              type: number
            unreimbursedExpenses:
              type: number
            cash:
              type: number
              description: |
                Ledger-source: net debit balance of asset accounts with subtype
                'cash' as of toDate. Operational source: mirrors cashOnHand.
            accountsReceivable:
              type: number
              description: |
                Ledger-source: net debit balance of asset accounts with subtype
                'ar'. Operational source: mirrors outstandingReceivables.
            otherAssets:
              type: number
              description: |
                Ledger-source: net debit balance of all remaining asset
                accounts (everything not classified as cash or AR, including
                contra-asset accounts). Operational source: 0.
            accountsPayable:
              type: number
              description: |
                Ledger-source: net credit balance of liability accounts with
                subtype 'ap'. Operational source: mirrors unpaidBills.
            otherLiabilities:
              type: number
              description: |
                Ledger-source: net credit balance of all remaining liability
                accounts (including contra-liability). Operational source:
                mirrors unreimbursedExpenses.
            totalAssets:
              type: number
            totalLiabilities:
              type: number
            equity:
              type: number
            openingNetAssets:
              type: number
              description: |
                Equity carried forward from periods strictly before fromDate.
                Computed as `equity - currentPeriodNetIncome` so the three
                equity rows always reconcile to assets − liabilities.
            currentPeriodNetIncome:
              type: number
              description: |
                Net income for the selected period (totalIncome −
                totalExpenses). The change in net assets contributed by
                activity inside [fromDate, toDate].
            cashAccounts:
              type: array
              description: |
                Per-CoA-account rows that sum to the `cash` total (ledger
                source). Empty for the operational source.
              items:
                $ref: '#/components/schemas/BalanceSheetAccount'
            accountsReceivableAccounts:
              type: array
              description: Per-account rows summing to `accountsReceivable`.
              items:
                $ref: '#/components/schemas/BalanceSheetAccount'
            otherAssetAccounts:
              type: array
              description: Per-account rows summing to `otherAssets`.
              items:
                $ref: '#/components/schemas/BalanceSheetAccount'
            accountsPayableAccounts:
              type: array
              description: Per-account rows summing to `accountsPayable`.
              items:
                $ref: '#/components/schemas/BalanceSheetAccount'
            otherLiabilityAccounts:
              type: array
              description: Per-account rows summing to `otherLiabilities`.
              items:
                $ref: '#/components/schemas/BalanceSheetAccount'
          required:
            - cashOnHand
            - outstandingReceivables
            - unpaidBills
            - unreimbursedExpenses
            - cash
            - accountsReceivable
            - otherAssets
            - accountsPayable
            - otherLiabilities
            - totalAssets
            - totalLiabilities
            - equity
            - openingNetAssets
            - currentPeriodNetIncome
            - cashAccounts
            - accountsReceivableAccounts
            - otherAssetAccounts
            - accountsPayableAccounts
            - otherLiabilityAccounts
      required:
        - generatedAt
        - expenseTotalsByStatus
        - billTotalsByStatus
        - spendByProgram
        - topVendors
        - missingReceiptCount
        - missingReceiptAmount
        - missingReceipts
        - bankReconciliation
        - profitAndLoss
        - balanceSheet

