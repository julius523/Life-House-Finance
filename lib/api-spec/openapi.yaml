      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                periodStart:
                  type: string
                periodEnd:
                  type: string
                status:
                  type: string
                  enum: [open, closed]
              required: [label, periodStart, periodEnd]
      responses:
        "201":
