          format: date-time
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        expenseTotalsByStatus:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: integer
              amount:
                type: number
            required:
              - status
              - count
              - amount
        billTotalsByStatus:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: integer
              amount:
                type: number
            required:
              - status
              - count
              - amount
        spendByProgram:
          type: array
          items:
            type: object
            properties:
              programId:
                type: integer
              programName:
                type: string
              budgetAmount:
                type: number
              expenseAmount:
                type: number
              billAmount:
                type: number
              totalAmount:
                type: number
              percentUsed:
                type: number
            required:
              - programName
              - expenseAmount
              - billAmount
              - totalAmount
        topVendors:
          type: array
          items:
            type: object
            properties:
              vendorId:
                type: integer
              vendorName:
                type: string
              billAmount:
                type: number
              expenseAmount:
                type: number
              totalAmount:
                type: number
            required:
              - vendorName
              - totalAmount
        missingReceiptCount:
          type: integer
        missingReceiptAmount:
          type: number
        missingReceipts:
          type: array
          items:
            $ref: "#/components/schemas/MissingReceiptItem"
        bankReconciliation:
          type: object
          properties:
            totalTransactions:
              type: integer
            unmatched:
              type: integer
            matched:
              type: integer
            reconciled:
              type: integer
            totalDebits:
              type: number
            totalCredits:
              type: number
            netCashFlow:
              type: number
          required:
            - totalTransactions
            - unmatched
            - matched
            - reconciled
            - totalDebits
            - totalCredits
            - netCashFlow
        profitAndLoss:
          type: object
          properties:
            incomeByProgram:
              type: array
              items:
                type: object
                properties:
                  programId: { type: integer }
                  programName: { type: string }
                  amount: { type: number }
                required: [programName, amount]
            uncategorizedIncome:
              type: number
            totalIncome:
              type: number
            expensesByProgram:
              type: array
              items:
                type: object
                properties:
                  programId: { type: integer }
                  programName: { type: string }
                  amount: { type: number }
                required: [programName, amount]
            uncategorizedExpenses:
              type: number
            totalExpenses:
              type: number
            netIncome:
              type: number
          required:
            - incomeByProgram
            - uncategorizedIncome
            - totalIncome
            - expensesByProgram
            - uncategorizedExpenses
            - totalExpenses
            - netIncome
        balanceSheet:
          type: object
          properties:
            cashOnHand:
              type: number
              description: Net of reconciled credits minus reconciled debits.
            outstandingReceivables:
              type: number
              description: Matched-but-not-yet-reconciled credits.
            unpaidBills:
              type: number
            unreimbursedExpenses:
              type: number
            cash:
              type: number
              description: |
                Ledger-source: net debit balance of asset accounts with subtype
                'cash' as of toDate. Operational source: mirrors cashOnHand.
            accountsReceivable:
              type: number
              description: |
                Ledger-source: net debit balance of asset accounts with subtype
                'ar'. Operational source: mirrors outstandingReceivables.
            otherAssets:
              type: number
              description: |
                Ledger-source: net debit balance of all remaining asset
                accounts (everything not classified as cash or AR, including
                contra-asset accounts). Operational source: 0.
            accountsPayable:
              type: number
              description: |
                Ledger-source: net credit balance of liability accounts with
                subtype 'ap'. Operational source: mirrors unpaidBills.
            otherLiabilities:
              type: number
              description: |
                Ledger-source: net credit balance of all remaining liability
                accounts (including contra-liability). Operational source:
                mirrors unreimbursedExpenses.
            totalAssets:
              type: number
            totalLiabilities:
              type: number
            equity:
              type: number
          required:
            - cashOnHand
            - outstandingReceivables
            - unpaidBills
            - unreimbursedExpenses
            - cash
            - accountsReceivable
            - otherAssets
            - accountsPayable
            - otherLiabilities
            - totalAssets
            - totalLiabilities
            - equity
      required:
        - generatedAt
        - expenseTotalsByStatus
        - billTotalsByStatus
        - spendByProgram
        - topVendors
        - missingReceiptCount
        - missingReceiptAmount
        - missingReceipts
        - bankReconciliation
        - profitAndLoss
        - balanceSheet

