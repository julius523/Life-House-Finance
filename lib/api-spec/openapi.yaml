        id:
          type: integer
        type:
          type: string
          enum: [expense, bill]
        referenceId:
          type: integer
        submittedBy:
          type: string
        description:
          type: string
        amount:
          type: number
        programName:
          type: string
        submittedAt:
          type: string
          format: date-time
        daysWaiting:
          type: integer
        urgency:
          type: string
          enum: [low, medium, high]
      required:
        - id
        - type
        - referenceId
        - submittedBy
        - description
        - amount
        - submittedAt
        - daysWaiting
        - urgency

    MonthEndChecklist:
