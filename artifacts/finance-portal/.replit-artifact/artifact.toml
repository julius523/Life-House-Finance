kind = "web"
previewPath = "/"
title = "Life House Finance Portal"
version = "1.0.0"
id = "artifacts/finance-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22083

[services.development]
run = "pnpm --filter @workspace/finance-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/finance-portal", "run", "build" ]
publicDir = "artifacts/finance-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22083"
BASE_PATH = "/"
