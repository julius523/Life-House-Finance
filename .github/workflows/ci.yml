name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (api-server + finance-portal)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lifehouse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifehouse_ci
      NODE_ENV: development
      # SEED_DEV_USERS lets the api-server test suite seed the synthetic
      # dev accounts assertDevSeedSafe() requires. Safe in CI because the
      # database is ephemeral and isolated to the workflow run.
      SEED_DEV_USERS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push database schema
        run: pnpm --filter @workspace/db push

      - name: Run api-server tests
        run: pnpm --filter @workspace/api-server test

      - name: Run finance-portal tests
        run: pnpm --filter @workspace/finance-portal test
